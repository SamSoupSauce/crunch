<svg id="crunchSvg" class="w-full h-auto max-h-[78vh] drop-shadow-2xl select-none" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Background Radial Field -->
          <radialGradient id="bgGlowRadial" cx="50%" cy="46%" r="55%">
            <stop offset="0%" stop-color="#141c2c" stop-opacity="0.8"></stop>
            <stop offset="45%" stop-color="#0c111c" stop-opacity="0.95"></stop>
            <stop offset="100%" stop-color="#080c14" stop-opacity="1"></stop>
          </radialGradient>

          <!-- Core Collision Glow -->
          <radialGradient id="clashCoreGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1"></stop>
            <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.6"></stop>
            <stop offset="55%" stop-color="#ef4444" stop-opacity="0.4"></stop>
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0"></stop>
          </radialGradient>

          <!-- Left Rock Facet Gradients -->
          <linearGradient id="rockLeftTop" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#556073"></stop>
            <stop offset="100%" stop-color="#333b4b"></stop>
          </linearGradient>
          <linearGradient id="rockLeftFront" x1="0%" y1="0%" x2="100%" y2="80%">
            <stop offset="0%" stop-color="#3c4556"></stop>
            <stop offset="100%" stop-color="#242b37"></stop>
          </linearGradient>
          <linearGradient id="rockLeftDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a3240"></stop>
            <stop offset="100%" stop-color="#181d26"></stop>
          </linearGradient>

          <!-- Right Rock Facet Gradients -->
          <linearGradient id="rockRightTop" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#566276"></stop>
            <stop offset="100%" stop-color="#363f4f"></stop>
          </linearGradient>
          <linearGradient id="rockRightFront" x1="100%" y1="0%" x2="0%" y2="80%">
            <stop offset="0%" stop-color="#3d4758"></stop>
            <stop offset="100%" stop-color="#262d3a"></stop>
          </linearGradient>
          <linearGradient id="rockRightDark" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2b3342"></stop>
            <stop offset="100%" stop-color="#191e28"></stop>
          </linearGradient>

          <!-- Player 1 Blue Gradient -->
          <linearGradient id="blueMoverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0284c7"></stop>
            <stop offset="60%" stop-color="#0ea5e9"></stop>
            <stop offset="100%" stop-color="#38bdf8"></stop>
          </linearGradient>

          <!-- Player 2 Red Gradient -->
          <linearGradient id="redMoverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f43f5e"></stop>
            <stop offset="40%" stop-color="#e11d48"></stop>
            <stop offset="100%" stop-color="#be123c"></stop>
          </linearGradient>

          <!-- Drop Shadows -->
          <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
            <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
          </filter>
        </defs>

        <rect width="1280" height="820" fill="url(#bgGlowRadial)"></rect>

        <!-- Ambient Hexagonal Background Lattice -->
        <g id="hexLattice" stroke="#222b3a" stroke-width="2.2" stroke-linejoin="round" opacity="0.45" fill="none">
          <!-- Row 1 (top) -->
          <polygon points="560,190 600,167 640,190 640,236 600,259 560,236"></polygon>
          <polygon points="640,190 680,167 720,190 720,236 680,259 640,236"></polygon>
          
          <!-- Row 2 -->
          <polygon points="480,236 520,213 560,236 560,282 520,305 480,282"></polygon>
          <polygon points="560,236 600,213 640,236 640,282 600,305 560,282"></polygon>
          <polygon points="640,236 680,213 720,236 720,282 680,305 640,282"></polygon>
          <polygon points="720,236 760,213 800,236 800,282 760,305 720,282"></polygon>

          <!-- Row 3 (Mid Left & Right Wings) -->
          <polygon points="400,282 440,259 480,282 480,328 440,351 400,328"></polygon>
          <polygon points="480,282 520,259 560,282 560,328 520,351 480,328"></polygon>
          <polygon points="720,282 760,259 800,282 800,328 760,351 720,328"></polygon>
          <polygon points="800,282 840,259 880,282 880,328 840,351 800,328"></polygon>

          <!-- Row 4 -->
          <polygon points="360,351 400,328 440,351 440,397 400,420 360,397"></polygon>
          <polygon points="400,351 440,328 480,351 480,397 440,420 400,397"></polygon>
          <polygon points="800,351 840,328 880,351 880,397 840,420 800,397"></polygon>
          <polygon points="840,351 880,328 920,351 920,397 880,420 840,397"></polygon>

          <!-- Row 5 (Lower Base Hexes) -->
          <polygon points="400,420 440,397 480,420 480,466 440,489 400,466"></polygon>
          <polygon points="480,420 520,397 560,420 560,466 520,489 480,466"></polygon>
          <polygon points="720,420 760,397 800,420 800,466 760,489 720,466"></polygon>
          <polygon points="800,420 840,397 880,420 880,466 840,489 800,466"></polygon>

          <polygon points="480,489 520,466 560,489 560,535 520,558 480,535"></polygon>
          <polygon points="560,489 600,466 640,489 640,535 600,558 560,535"></polygon>
          <polygon points="640,489 680,466 720,489 720,535 680,558 640,535"></polygon>
          <polygon points="720,489 760,466 800,489 800,535 760,558 720,535"></polygon>
        </g>

        <!-- Cardinal Axis Vector Indicators (Blue Left / Red Right) -->
        <g id="vectorPointers" class="transition-opacity duration-300">
          <!-- Left Blue Pointer -->
          <path d="M 280 376 L 368 371 L 368 381 Z" fill="#0284c7" filter="url(#vectorGlow)"></path>
          <line x1="260" y1="376" x2="370" y2="376" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"></line>

          <!-- Right Red Pointer -->
          <path d="M 1000 376 L 912 371 L 912 381 Z" fill="#e11d48" filter="url(#vectorGlow)"></path>
          <line x1="1020" y1="376" x2="910" y2="376" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"></line>
        </g>

        <!-- LEFT BOULDER (Incoming Pushed Rock) -->
        <g id="leftBoulder">
          <!-- Main Outer Silhouette Base -->
          <polygon points="350,378 402,284 496,252 590,326 572,420 538,474 416,498 344,438" fill="#161c26" stroke="#10151e" stroke-width="6" stroke-linejoin="round"></polygon>
          
          <!-- Facet Top Light -->
          <polygon points="402,284 496,252 546,312 458,322" fill="url(#rockLeftTop)"></polygon>
          
          <!-- Facet Upper Outer -->
          <polygon points="350,378 402,284 458,322 396,388" fill="url(#rockLeftFront)"></polygon>
          
          <!-- Facet Central Facing Pressure -->
          <polygon points="458,322 546,312 590,326 558,406 480,404" fill="#444f62"></polygon>
          
          <!-- Facet Inner Collision Wall (Crack Facing) -->
          <polygon points="546,312 590,326 574,382 540,366" fill="#2f3846"></polygon>
          <polygon points="574,382 572,420 528,426 540,366" fill="#202733"></polygon>

          <!-- Facet Lower Front -->
          <polygon points="396,388 480,404 538,474 416,498 344,438 350,378" fill="url(#rockLeftDark)"></polygon>
          
          <polygon points="458,322 480,404 396,388" fill="#343d4d"></polygon>

          <!-- Structural Stress Fracture Lines on Left Rock -->
          <path d="M 436 340 L 452 368 L 434 394 M 518 290 L 512 344 L 546 376" stroke="#151b24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        </g>

        <!-- RIGHT BOULDER (Opposing / Trapping Rock) -->
        <g id="rightBoulder">
          <!-- Main Outer Silhouette Base -->
          <polygon points="930,378 878,284 784,252 690,326 708,420 742,474 864,498 936,438" fill="#161c26" stroke="#10151e" stroke-width="6" stroke-linejoin="round"></polygon>

          <!-- Facet Top Light -->
          <polygon points="878,284 784,252 734,312 822,322" fill="url(#rockRightTop)"></polygon>

          <!-- Facet Upper Outer -->
          <polygon points="930,378 878,284 822,322 884,388" fill="url(#rockRightFront)"></polygon>

          <!-- Facet Central Facing Pressure -->
          <polygon points="822,322 734,312 690,326 722,406 800,404" fill="#444f62"></polygon>

          <!-- Facet Inner Collision Wall (Crack Facing) -->
          <polygon points="734,312 690,326 706,382 740,366" fill="#2f3846"></polygon>
          <polygon points="706,382 708,420 752,426 740,366" fill="#202733"></polygon>

          <!-- Facet Lower Front -->
          <polygon points="884,388 800,404 742,474 864,498 936,438 930,378" fill="url(#rockRightDark)"></polygon>

          <polygon points="822,322 800,404 884,388" fill="#343d4d"></polygon>

          <!-- Structural Stress Fracture Lines on Right Rock -->
          <path d="M 844 340 L 828 368 L 846 394 M 762 290 L 768 344 L 734 376" stroke="#151b24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        </g>

        <!-- KINETIC SHOCKWAVE & SHATTER SHARDS -->
        <g id="energyBursts">
          <!-- BLUE ENERGY RAYS & SHARDS (Left Blast) -->
          <g filter="url(#vectorGlow)">
            <!-- Primary Spikes -->
            <polygon points="636,250 638,180 644,248" fill="#38bdf8"></polygon>
            <polygon points="620,270 570,195 628,266" fill="#0ea5e9"></polygon>
            <polygon points="610,298 526,240 618,305" fill="#38bdf8"></polygon>
            <polygon points="602,342 505,322 606,354" fill="#0284c7"></polygon>
            <polygon points="602,398 518,416 605,386" fill="#38bdf8"></polygon>
            <polygon points="612,444 544,484 622,434" fill="#0ea5e9"></polygon>
            <polygon points="624,472 588,542 636,464" fill="#0284c7"></polygon>
            <polygon points="638,490 636,564 644,488" fill="#38bdf8"></polygon>
            
            <!-- Floating Angular Debris Shards (Blue) -->
            <polygon points="562,232 546,218 558,212" fill="#38bdf8"></polygon>
            <polygon points="536,280 514,272 524,260" fill="#0ea5e9"></polygon>
            <polygon points="516,368 494,360 502,352" fill="#38bdf8"></polygon>
            <polygon points="550,450 532,458 544,472" fill="#0284c7"></polygon>
            <polygon points="590,520 576,536 572,522" fill="#38bdf8"></polygon>
          </g>

          <!-- RED ENERGY RAYS & SHARDS (Right Blast) -->
          <g filter="url(#vectorGlow)">
            <!-- Primary Spikes -->
            <polygon points="644,248 642,180 646,250" fill="#f43f5e"></polygon>
            <polygon points="652,266 710,195 660,270" fill="#fb7185"></polygon>
            <polygon points="662,305 754,240 670,298" fill="#e11d48"></polygon>
            <polygon points="674,354 775,322 678,342" fill="#f43f5e"></polygon>
            <polygon points="675,386 762,416 678,398" fill="#be123c"></polygon>
            <polygon points="658,434 736,484 668,444" fill="#fb7185"></polygon>
            <polygon points="644,464 692,542 656,472" fill="#e11d48"></polygon>
            <polygon points="644,488 644,564 642,490" fill="#f43f5e"></polygon>

            <!-- Floating Angular Debris Shards (Red) -->
            <polygon points="718,232 734,218 722,212" fill="#f43f5e"></polygon>
            <polygon points="744,280 766,272 756,260" fill="#fb7185"></polygon>
            <polygon points="764,368 786,360 778,352" fill="#f43f5e"></polygon>
            <polygon points="730,450 748,458 736,472" fill="#e11d48"></polygon>
            <polygon points="690,520 704,536 708,522" fill="#f43f5e"></polygon>
          </g>
        </g>

        <!-- THE TRAPPED MOVER (Pawn Caught in the Crunch) -->
        <g id="crushedMover" class="kinetic-pulse">
          <!-- Central Glow Core -->
          <circle cx="640" cy="380" r="48" fill="url(#clashCoreGlow)"></circle>

          <!-- Player 1 (Blue Half - Facing Left Pressure) -->
          <path d="M 640 286 
                   C 628 286 618 296 618 308 
                   C 618 318 624 326 632 329 
                   C 624 335 619 346 620 366 
                   C 620 376 616 384 612 392 
                   L 602 422 
                   C 600 428 604 434 610 434 
                   L 640 434 Z" fill="url(#blueMoverGrad)" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round"></path>

          <!-- Player 2 (Red Half - Facing Right Wall / Rock) -->
          <path d="M 640 286 
                   C 652 286 662 296 662 308 
                   C 662 318 656 326 648 329 
                   C 656 335 661 346 660 366 
                   C 660 376 664 384 668 392 
                   L 678 422 
                   C 680 428 676 434 670 434 
                   L 640 434 Z" fill="url(#redMoverGrad)" stroke="#be123c" stroke-width="2.5" stroke-linejoin="round"></path>

          <!-- High-Voltage Focal Fault Line (Vertical Fracture through Pawn) -->
          <line x1="640" y1="270" x2="640" y2="444" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#vectorGlow)"></line>
          
          <!-- Inner Mover Collar and Tier Accents -->
          <path d="M 626 332 L 640 334 L 654 332" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"></path>
          <path d="M 610 424 L 640 426 L 670 424" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"></path>
        </g>

        <!-- BRANDING TYPOGRAPHY SECTION -->
        <g id="crunchTypography" text-anchor="middle">
          <!-- Main Title: CRUNCH -->
          <text x="640" y="642" fill="#ffffff" font-family="'Chakra Petch', sans-serif" font-size="76" font-weight="800" letter-spacing="5" style="text-transform: uppercase;">
            CRUNCH
          </text>

          <!-- Subtitle: ROCK CHESS -->
          <text x="640" y="688" fill="#94a3b8" font-family="'Chakra Petch', sans-serif" font-size="28" font-weight="700" letter-spacing="8" style="text-transform: uppercase;">
            ROCK CHESS
          </text>

          <!-- Release Version Descriptor: V1.0.0 — STABLE RELEASE -->
          <text x="600" y="722" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" letter-spacing="4">
            V1.0.0 — STABLE RELEASE
          </text>

          <!-- Vector Asset Badge (Bottom Right Graphic Anchor) -->
          <g transform="translate(805, 696)">
            <!-- Flower/Vectors Icon glyph -->
            <path d="M 12 4 C 12 1 15 1 15 4 C 15 7 12 7 12 4 Z" fill="#f59e0b"></path>
            <path d="M 12 14 C 12 17 9 17 9 14 C 9 11 12 11 12 14 Z" fill="#f59e0b"></path>
            <path d="M 5 7 C 2 7 2 10 5 10 C 8 10 8 7 5 7 Z" fill="#f59e0b"></path>
            <path d="M 19 11 C 22 11 22 8 19 8 C 16 8 16 11 19 11 Z" fill="#f59e0b"></path>
            <circle cx="12" cy="9" r="2.2" fill="#d97706"></circle>
            <!-- Text SVG -->
            <text x="14" y="24" fill="#f1f5f9" font-family="'Chakra Petch', sans-serif" font-size="16" font-weight="800" letter-spacing="1">
              SVG
            </text>
          </g>
        </g>
      </svg>
